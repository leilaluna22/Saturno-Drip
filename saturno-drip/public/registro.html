<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Saturno Drip</title>
    <link rel="icon" type="image/png" href="/img/SDlogo">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header id="site-header"></header>

    <main class="auth-page">
        <form class="auth-card" id="authForm" data-mode="register" novalidate>
            <h2>Crear cuenta</h2>
            <p class="auth-sub">Registrate para guardar tu carrito y comprar.</p>

            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Contraseña <small>(mínimo 8 caracteres)</small></label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

            <label for="password2">Repetir contraseña</label>
            <input type="password" id="password2" name="password2" autocomplete="new-password" required>

            <p class="form-error" id="formError" role="alert" hidden></p>

            <button type="submit" class="btn-primary" id="submitBtn">Crear cuenta</button>

            <p class="auth-switch">¿Ya tenés cuenta? <a href="/login.html" id="switchLink">Iniciá sesión</a></p>
        </form>
    </main>

    <footer><p>© 2026 Saturno Drip</p></footer>
    <script src="/script.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
