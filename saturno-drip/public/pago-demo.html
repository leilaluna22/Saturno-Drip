<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago de prueba | Saturno Drip</title>
    <link rel="icon" type="image/png" href="/img/SDlogo.png">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header id="site-header"></header>

    <main class="result-page">
        <div class="result-card">
            <div class="result-icon">🧪</div>
            <h2>Modo de prueba</h2>
            <p>
                Todavía no configuraste Mercado Pago, así que este es un pago <strong>simulado</strong>:
                no se cobra nada. Sirve para probar cómo se marcan las prendas como agotadas.
            </p>
            <div class="result-actions">
                <button class="btn-primary" id="approve">Simular pago aprobado</button>
                <button class="btn-secondary" id="reject">Simular pago rechazado</button>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
    <script src="/pago-demo.js"></script>
</body>

</html>
