<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Saturno Drip</title>
    <link rel="icon" type="image/png" href="/img/SDlogo.png">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header id="site-header"></header>

    <main class="auth-page">
        <form class="auth-card" id="authForm" data-mode="login" novalidate>
            <h2>Iniciar sesión</h2>
            <p class="auth-sub">Ingresá con tu cuenta para comprar.</p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <p class="form-error" id="formError" role="alert" hidden></p>

            <button type="submit" class="btn-primary" id="submitBtn">Ingresar</button>

            <p class="auth-switch">¿No tenés cuenta? <a href="/registro.html" id="switchLink">Registrate</a></p>
        </form>
    </main>

    <footer><p>© 2026 Saturno Drip</p></footer>
    <script src="/script.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
